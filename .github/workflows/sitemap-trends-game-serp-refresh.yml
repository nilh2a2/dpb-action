name: sitemap-trends-game-serp-refresh

on:
  # Every 6 hours. Refresh SERP intent reports and discover candidate domains for known games.
  schedule:
    - cron: '15 */6 * * *'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - development
          - production
        default: 'development'

jobs:
  sitemap-trends-game-serp-refresh:
    uses: ./.github/workflows/_base.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'production' }}
      timeout-minutes: 30
      command: sitemap-trends game-serp-refresh

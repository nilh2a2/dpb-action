name: sitemap-trends-game-metrics-refresh

on:
  # Every 2 hours. Keep each run short so schedules can land on different hosted runners.
  schedule:
    - cron: '17 */2 * * *'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - development
          - production
        default: 'development'

jobs:
  sitemap-trends-game-metrics-refresh:
    uses: ./.github/workflows/_base.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'production' }}
      timeout-minutes: 28
      command: sitemap-trends game-metrics-refresh
